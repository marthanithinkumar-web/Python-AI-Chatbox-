name: CampusBot NLP tests

on:
  push:
    branches: [main, python-nlp-only]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NLP dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application and tests
        run: python -m py_compile CampusBot.py tests/test_campusbot.py
      - name: Run NLP regression tests
        run: python -m unittest discover -s tests -v
